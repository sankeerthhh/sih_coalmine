services:
  # FastAPI Backend Web Service
  - type: web
    name: mine-subsidence-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
        # Example: postgresql://postgres:password@host:5432/postgres
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: MQTT_ENABLED
        value: "false"
      - key: PYTHON_VERSION
        value: 3.13.0

  # React + Vite Frontend Static Site
  - type: web
    name: mine-subsidence-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
